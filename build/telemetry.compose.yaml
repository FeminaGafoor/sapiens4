x-collector: &collector
  image: sapiens-telemetry:a7e5aa3
  pull_policy: never
  restart: on-failure
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  stop_grace_period: 15s

services:
  dev:
    <<: *collector
    user: "${TELEMETRY_DEV_USER:-10001:10001}"
    cpus: 0.5
    env_file: /etc/telemetry-simple/dev/secret.env
    ports: ["127.0.0.1:4181:4181"]
    volumes:
      - type: bind
        source: /etc/telemetry-simple/dev/docker.json
        target: /etc/telemetry/config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/telemetry-data/dev
        target: /data
        bind:
          create_host_path: false
  prod:
    <<: *collector
    user: "${TELEMETRY_PROD_USER:?Set TELEMETRY_PROD_USER}"
    cpus: 1
    env_file: /etc/telemetry-simple/prod/secret.env
    ports: ["127.0.0.1:4183:4183"]
    volumes:
      - type: bind
        source: /etc/telemetry-simple/prod/docker.json
        target: /etc/telemetry/config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/telemetry-data/prod
        target: /data
        bind:
          create_host_path: false
